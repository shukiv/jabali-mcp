openapi: 3.0.3
info:
  title: Jabali Panel API
  version: "v1"
  description: |
    The Jabali Panel REST API. Two authentication paths:

    - **Browser sessions** (Kratos cookie) — interactive UI use
    - **Bearer tokens** (`Authorization: Bearer jat_…`) — programmatic access
      from scripts / CI / routers. Tokens are scoped to the user that minted
      them; admin tokens carry the same is_admin flag as the owning user.

    Every endpoint enforces ownership (`claims.UserID == resource.UserID`)
    OR `is_admin = true`. Endpoints under `/admin/` are admin-only.

    Token mint UI: tenant shell → API Tokens. Plaintext is shown once at
    creation; the panel only stores the SHA-256 hash thereafter.

    ## Error envelope

    All non-2xx responses return JSON:
    ```
    { "error": "<machine-readable>", "message": "<human-readable, optional>" }
    ```
    HTTP status conveys the category; the `error` field disambiguates within
    a category (e.g. 401 may be `missing_credentials` vs `invalid_token`).
  contact:
    name: Jabali Panel
    url: https://github.com/shukiv/jabali-panel
servers:
  - url: https://{panel-hostname}:8443/api/v1
    description: Self-hosted panel
    variables:
      panel-hostname:
        default: jabali-panel.local
tags:
  - name: API Tokens
    description: Per-user Bearer-token CRUD. Manageable only via browser session.
  - name: DNS
    description: Zones + records for owned domains.
  - name: DDNS
    description: Dynamic-DNS shim — DynDNS v2 protocol-compatible.
  - name: Domains
    description: List / create / update / delete tenant domains.
  - name: Mailboxes
    description: Email accounts on owned mail-enabled domains.
  - name: Mailbox Forwarders
    description: Email-forwarding rules.
  - name: Applications
    description: 1-click installs (WordPress, Joomla, Drupal, …).
  - name: Backups
    description: Per-user backup snapshots + restore.
  - name: Databases
    description: MariaDB / Postgres databases + per-tenant users.
  - name: SSH Keys
    description: SFTP / SSH key management.
  - name: Cron
    description: Per-user systemd-user scheduled jobs.
  - name: Files
    description: File-manager REST surface.
  - name: PHP
    description: Per-domain PHP settings + installed runtimes.
  - name: SSL
    description: Per-domain Let's Encrypt + custom certs.
  - name: Account
    description: The calling user's own account — profile, disk usage, activity.
  - name: Users
    description: Admin user CRUD.
  - name: Server Settings
    description: Panel-wide config (hostname, DNS, storage, …). Admin only.
  - name: Services
    description: Admin service control (restart, reload).
  - name: Updates
    description: Admin self-update + diagnostics.

# ---------------------------------------------------------------- security ---
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: jat_…
      description: |
        Per-user token minted via POST /me/api-tokens. Send as
        `Authorization: Bearer jat_<43-char base64url>`.
    KratosSession:
      type: apiKey
      in: cookie
      name: ory_kratos_session
      description: Browser cookie from /login. Same-origin only.
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: invalid_token }
        message: { type: string, example: "API token is invalid, revoked, or expired" }
    DNSRecord:
      type: object
      required: [id, zone_id, name, type, content, ttl, is_enabled]
      properties:
        id:          { type: string, format: ulid, example: 01KT5… }
        zone_id:     { type: string, format: ulid }
        name:        { type: string, example: vpn, description: "Relative to zone apex; '@' = apex" }
        type:        { type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, CAA, NS], example: A }
        content:     { type: string, example: 203.0.113.5 }
        ttl:         { type: integer, minimum: 60, maximum: 604800, example: 3600 }
        priority:    { type: integer, default: 0 }
        is_enabled:  { type: boolean, default: true }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
    DNSRecordCreate:
      type: object
      required: [name, type, content]
      properties:
        name:    { type: string, example: vpn }
        type:    { type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, CAA, NS] }
        content: { type: string, example: 203.0.113.5 }
        ttl:     { type: integer, example: 3600, description: "Omit to use server-wide default (Server Settings → DNS)." }
        priority: { type: integer }
    Domain:
      type: object
      required: [id, user_id, name, is_enabled]
      properties:
        id:         { type: string, format: ulid }
        user_id:    { type: string, format: ulid }
        name:       { type: string, example: example.com }
        is_enabled: { type: boolean }
        email_enabled: { type: boolean }
        ssl_enabled: { type: boolean }
        doc_root:    { type: string }
        php_version: { type: string, example: "8.4" }
        created_at:  { type: string, format: date-time }
    Mailbox:
      type: object
      required: [id, domain_id, local_part, quota_mb]
      properties:
        id:         { type: string, format: ulid }
        domain_id:  { type: string, format: ulid }
        local_part: { type: string, example: alice }
        email:      { type: string, example: alice@example.com, readOnly: true }
        quota_mb:   { type: integer, example: 1024 }
        created_at: { type: string, format: date-time }
    UserAPIToken:
      type: object
      required: [id, user_id, name, secret_last4, created_at]
      properties:
        id:           { type: string, format: ulid }
        user_id:      { type: string, format: ulid }
        name:         { type: string, example: "office router DDNS" }
        secret_last4: { type: string, example: aB9c, description: "Last 4 chars of plaintext for UI disambiguation." }
        scopes:
          type: array
          items: { type: string, example: "dns:*" }
          nullable: true
          description: "null = full per-user access. Wildcard supported (dns:* matches dns:read + dns:write)."
        last_used_at: { type: string, format: date-time, nullable: true }
        last_used_ip: { type: string, nullable: true }
        expires_at:   { type: string, format: date-time, nullable: true }
        revoked_at:   { type: string, format: date-time, nullable: true }
        created_at:   { type: string, format: date-time }
    UserAPITokenCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "office router DDNS", maxLength: 100 }
        expires_in_seconds:
          type: integer
          minimum: 60
          maximum: 31536000
          description: "Optional. Omit for an infinite-lifetime API key. Capped at 1 year."
        scopes:
          type: array
          items: { type: string }
          description: "Optional. Omit for full per-user access. Wildcard supported."
    UserAPITokenMintResponse:
      type: object
      required: [token, secret]
      properties:
        token:  { $ref: "#/components/schemas/UserAPIToken" }
        secret: { type: string, example: jat_aBc…XyZ, description: "Plaintext bearer token. Shown ONCE." }

security:
  - BearerToken: []
  - KratosSession: []

# -------------------------------------------------------------------- paths ---
paths:

  /me/api-tokens:
    get:
      tags: [API Tokens]
      summary: List your API tokens
      description: |
        Returns every token (active + revoked) the calling user owns,
        newest first. SecretHash is never returned; SecretLast4 is shown
        for UI disambiguation.

        **Auth:** browser session ONLY. Token-authed callers get 403
        (defense-in-depth — a leaked token cannot enumerate or mint
        siblings).
      security:
        - KratosSession: []
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserAPIToken" }
        "403": { description: Token-authed request rejected, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [API Tokens]
      summary: Mint a new API token
      description: |
        Generates a 256-bit secret + returns it ONCE alongside the token
        metadata. The plaintext is never persisted; the panel only keeps
        a SHA-256 hash.

        **Auth:** browser session ONLY.
      security:
        - KratosSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserAPITokenCreate" }
      responses:
        "201":
          description: Token created — secret in response, copy it now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAPITokenMintResponse" }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /me/api-tokens/{id}:
    delete:
      tags: [API Tokens]
      summary: Revoke a token
      description: |
        Sets revoked_at = now(). Subsequent Bearer requests using this
        token return 401. Already-revoked tokens are no-op.

        **Auth:** browser session ONLY.
      security:
        - KratosSession: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: ulid }
      responses:
        "204": { description: Revoked }
        "404": { description: No such token (or owned by another user) }

  # ----------------------------------------------------------------- DNS ---

  /domains/{id}/dns/records:
    get:
      tags: [DNS]
      summary: List records in a zone
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DNSRecord" }
    post:
      tags: [DNS]
      summary: Create a record
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSRecordCreate" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSRecord" } } }
        "400": { description: Validation error }
        "404": { description: Domain not owned by caller }

  /dns/records/{id}:
    patch:
      tags: [DNS]
      summary: Update a record
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, example: 203.0.113.99 }
                ttl:     { type: integer }
                priority: { type: integer }
                is_enabled: { type: boolean }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/DNSRecord" } } } }
    delete:
      tags: [DNS]
      summary: Delete a record
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
      responses:
        "204": { description: Deleted }

  # ---------------------------------------------------------------- DDNS ---

  /nic/update:
    get:
      tags: [DDNS]
      summary: DynDNS v2 — update an A/AAAA record
      description: |
        Speaks the de-facto DynDNS protocol every router firmware
        (OpenWrt, Mikrotik, pfSense, Ubiquiti, ddclient, inadyn) already
        knows. Wraps the same per-user Bearer token in HTTP Basic-auth
        so existing DDNS clients can update records without a custom
        scripting integration.

        **Path:** mounted at the engine root, NOT under /api/v1, because
        every router hardcodes /nic/update.

        **Auth:** HTTP Basic. The username half is ignored (routers
        require it as input but the panel uses only the password). The
        password is your `jat_…` token.

        **myip:** omit to use the client's source IP (X-Real-IP /
        X-Forwarded-For / RemoteAddr).

        **Hostname:** must be a fully-qualified domain name. The panel
        does longest-suffix match against your owned domains to find
        the zone + record.
      servers:
        - url: https://{panel-hostname}:8443
          variables: { panel-hostname: { default: jabali-panel.local } }
      security:
        - BasicAuth: []
      parameters:
        - in: query
          name: hostname
          required: true
          schema: { type: string, example: vpn.example.com }
          description: FQDN of the record to update.
        - in: query
          name: myip
          schema: { type: string, example: 203.0.113.5 }
          description: New IP. Omit to use the request's source IP.
      responses:
        "200":
          description: |
            Text/plain single-line response — one of:
            - `good 1.2.3.4` — record updated
            - `nochg 1.2.3.4` — record already pointed at that IP
          content:
            text/plain:
              schema: { type: string, example: "good 1.2.3.4\n" }
        "400":
          description: "Malformed hostname or IP. Body: `notfqdn`."
          content: { text/plain: { schema: { type: string, example: "notfqdn\n" } } }
        "401":
          description: "Missing or invalid Basic auth. Body: `badauth`."
          content: { text/plain: { schema: { type: string, example: "badauth\n" } } }
        "404":
          description: "Hostname doesn't resolve to a record you own. Body: `nohost`."
          content: { text/plain: { schema: { type: string, example: "nohost\n" } } }
    post:
      tags: [DDNS]
      summary: DynDNS v2 — same as GET (some routers POST)
      description: Some router firmware sends POST instead of GET; semantics identical.
      security: [ { BasicAuth: [] } ]
      responses:
        "200": { description: See GET }

  # ------------------------------------------------------------- Domains ---

  /domains:
    get:
      tags: [Domains]
      summary: List your domains
      responses:
        "200":
          description: Domains owned by the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Domain" }
    post:
      tags: [Domains]
      summary: Add a domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: example.com }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } }

  /domains/{id}:
    get:
      tags: [Domains]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Domain" } } } } }
    patch:
      tags: [Domains]
      summary: Update a domain's settings (partial — absent fields are left untouched)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_enabled:        { type: boolean, description: "Enable or disable the site (vhost stays, serving stops)." }
                webmail_enabled:   { type: boolean, description: "Toggle the webmail subdomain for this domain." }
                temp_url_enabled:  { type: boolean, description: "Toggle the preview (temp) URL for this domain." }
                ssl_mode:          { type: string, enum: [le, self, none], description: "TLS mode: le = Let's Encrypt, self = self-signed, none = HTTP only. (custom/shared are managed via the panel's SSL settings.)" }
                redirect_all_to:   { type: string, description: "Redirect the whole site to this URL (clearing a redirect is done in the panel UI)." }
                redirect_all_type: { type: string, enum: ["301", "302", "307", "308"], description: "HTTP status for the site-wide redirect." }
      responses: { "200": { description: Updated } }
    delete:
      tags: [Domains]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "204": { description: Deleted } }

  # ----------------------------------------------------------- Mailboxes ---

  /domains/{id}/mailboxes:
    get:
      tags: [Mailboxes]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses:
        "200":
          description: Mailboxes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Mailbox" } }
    post:
      tags: [Mailboxes]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [local_part, password, quota_mb]
              properties:
                local_part: { type: string, example: alice }
                password:   { type: string, format: password, minLength: 12 }
                quota_mb:   { type: integer, example: 1024 }
      responses:
        "201": { description: Created }

  /mailboxes/{id}:
    get:
      tags: [Mailboxes]
      summary: Get a mailbox (address, quota, flags)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: OK } }
    patch:
      tags: [Mailboxes]
      summary: Update a mailbox (partial — absent fields are left untouched)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quota_bytes:  { type: integer, minimum: 16777216, description: "mailbox quota in bytes (min 16 MiB)" }
                display_name: { type: string, description: "display name shown in webmail" }
                is_disabled:  { type: boolean, description: "disable login + delivery for this mailbox" }
                send_only:    { type: boolean, description: "mailbox may send but not receive" }
      responses: { "200": { description: Updated } }
    delete:
      tags: [Mailboxes]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "204": { description: Deleted } }

  /mailboxes/{id}/autoresponder:
    get:
      tags: [Mailboxes]
      summary: Get a mailbox's autoresponder (vacation reply)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: Autoresponder config } }
    put:
      tags: [Mailboxes]
      summary: Set a mailbox's autoresponder (vacation reply)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:   { type: boolean, description: "turn the autoresponder on or off" }
                from_date: { type: string, format: date-time, description: "start (RFC 3339, e.g. 2026-08-10T00:00:00Z); omit for immediate" }
                to_date:   { type: string, format: date-time, description: "end (RFC 3339); omit for open-ended" }
                subject:   { type: string, description: "reply subject" }
                text_body: { type: string, description: "plain-text reply body" }
                html_body: { type: string, description: "HTML reply body" }
      responses: { "200": { description: Updated } }
    delete:
      tags: [Mailboxes]
      summary: Remove a mailbox's autoresponder
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "204": { description: Deleted } }

  /mailboxes/{id}/rotate-password:
    post:
      tags: [Mailboxes]
      summary: Rotate a mailbox password (returns the new password once)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password: { type: string, format: password, description: "omit to auto-generate a strong password" }
      responses: { "200": { description: "New password (shown once — save it immediately)" } }

  /mailboxes/{id}/password:
    put:
      tags: [Mailboxes]
      summary: Change mailbox password
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 12 }
      responses: { "204": { description: Changed } }

  # -------------------------------------------------------- Forwarders ---

  /domains/{id}/forwarders:
    get:
      tags: [Mailbox Forwarders]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: OK } }
    post:
      tags: [Mailbox Forwarders]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, dest]
              properties:
                source: { type: string, example: sales@example.com }
                dest:   { type: string, example: alice@example.com }
      responses: { "201": { description: Created } }

  # ------------------------------------------------------- Applications ---

  /applications:
    get:
      tags: [Applications]
      summary: List installed apps
      responses: { "200": { description: OK } }
    post:
      tags: [Applications]
      summary: Install an app (WordPress, Joomla, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain_id, kind]
              properties:
                domain_id: { type: string, format: ulid }
                kind:      { type: string, enum: [wordpress, joomla, drupal, moodle, ghost, opencart, prestashop, magento, drupal10, mediawiki, nextcloud, mautic, suitecrm, dolibarr, processmaker] }
                path:      { type: string, default: "/", description: "Install path under doc-root." }
      responses: { "201": { description: "Install started — poll /applications/{id} for status" } }

  /applications/registry:
    get:
      tags: [Applications]
      summary: App catalog — every kind the panel can one-click install
      responses: { "200": { description: Registry entries } }

  /applications/{id}:
    get:
      tags: [Applications]
      summary: Get an installed app (status, version, URL)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: OK } }
    delete:
      tags: [Applications]
      summary: Uninstall an app and remove its files (async)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "202": { description: Delete queued } }

  # ----------------------------------------------------------- Backups ---

  /me/backups:
    get:
      tags: [Backups]
      summary: List your snapshots
      responses: { "200": { description: OK } }
    post:
      tags: [Backups]
      summary: Trigger an on-demand backup
      responses: { "202": { description: Job queued } }

  /me/backups/{id}/restore:
    post:
      tags: [Backups]
      summary: Restore a snapshot
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "202": { description: Restore queued } }

  /me/backups/{id}:
    delete:
      tags: [Backups]
      summary: Delete a snapshot (forgets + prunes its data)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: Deleted } }

  /me/backups/{id}/manifest:
    get:
      tags: [Backups]
      summary: List a snapshot's contents (manifest; only for succeeded backups)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: Manifest JSON } }

  # --------------------------------------------------------- Databases ---

  /mail/logs:
    get:
      tags: [Logs]
      summary: List recent mail log entries for your domains (delivered/failed/queued)
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50, description: "max entries" } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
        - { in: query, name: sender, schema: { type: string, description: "filter by sender address" } }
        - { in: query, name: recipient, schema: { type: string, description: "filter by recipient address" } }
      responses:
        "200":
          description: Mail log page
          content: { application/json: { schema: { type: object, properties: {
            data: { type: array, items: { type: object } }, total: { type: integer }, page: { type: integer }, page_size: { type: integer } } } } }

  /logs/tail:
    get:
      tags: [Logs]
      summary: Tail a domain's nginx access or error log (last N lines, snapshot)
      parameters:
        - { in: query, name: domain_id, required: true, schema: { type: string, format: ulid, description: "the domain's ULID" } }
        - { in: query, name: log_type, required: true, schema: { type: string, enum: [access, error] } }
        - { in: query, name: lines, schema: { type: integer, default: 200, minimum: 1, maximum: 2000, description: "how many trailing lines" } }
      responses:
        "200":
          description: Last log lines
          content: { application/json: { schema: { type: object, properties: {
            domain_id: { type: string }, log_type: { type: string }, lines: { type: array, items: { type: string } } } } } }

  /databases:
    get:
      tags: [Databases]
      responses: { "200": { description: OK } }
    post:
      tags: [Databases]
      summary: Create a database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, engine]
              properties:
                name:   { type: string, example: myapp_prod }
                engine: { type: string, enum: [mysql, postgres] }
      responses: { "201": { description: Created } }

  /databases/{id}:
    get:
      tags: [Databases]
      summary: Get a database (engine, size, grants)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: OK } }
    delete:
      tags: [Databases]
      summary: Drop a database and all its data
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "204": { description: Deleted } }

  /database-users:
    get:
      tags: [Databases]
      summary: List your database users
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, description: "page number (1-based)" } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 200, description: "results per page (default 20)" } }
      responses: { "200": { description: Database users } }
    post:
      tags: [Databases]
      summary: Create a database user (returns its password once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, description: "login name (your account prefix is enforced)" }
                engine:   { type: string, description: "database engine (default mariadb)" }
      responses: { "201": { description: "Created — response contains the plaintext password, shown once" } }

  /database-users/{id}:
    delete:
      tags: [Databases]
      summary: Delete a database user (revokes all its grants)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: Deleted } }

  /database-users/{id}/grants:
    post:
      tags: [Databases]
      summary: Grant a database user access to one of your databases
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [database_id, grant_level]
              properties:
                database_id: { type: string, format: ulid, description: "the database's ULID" }
                grant_level: { type: string, enum: [rw, ro], description: "rw = read-write, ro = read-only" }
      responses: { "201": { description: Granted } }

  /database-user-grants/{id}:
    delete:
      tags: [Databases]
      summary: Revoke one database grant (keeps the user)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "204": { description: Revoked } }

  /database-users/{id}/rotate-password:
    post:
      tags: [Databases]
      summary: Rotate a database user's password (returns the new password once)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, format: password, description: "the new password to set" }
      responses: { "200": { description: "Rotated — save the new password immediately" } }

  # --------------------------------------------------------------- SSL ---

  /domains/{id}/ssl:
    get:
      tags: [SSL]
      summary: SSL certificate status for a domain
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: Certificate status }, "404": { description: No certificate } }
    post:
      tags: [SSL]
      summary: Enable SSL — issue a Let's Encrypt certificate for the domain
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "202": { description: "Issuance queued (200 if a valid cert has >30 days left)" } }
    delete:
      tags: [SSL]
      summary: Disable SSL — revoke the domain's certificate and stop serving HTTPS
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "202": { description: Revocation queued } }

  /domains/{id}/ssl/renew:
    post:
      tags: [SSL]
      summary: Force-renew a domain's certificate (admin)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "202": { description: Renewal queued } }

  /domains/{id}/ssl/retry:
    post:
      tags: [SSL]
      summary: Retry a failed certificate issuance (admin)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "202": { description: Retry queued } }

  # ------------------------------------------------------- Diagnostics ---

  /domains/{id}/whois:
    get:
      tags: [Domains]
      summary: WHOIS lookup for a domain (registrar, expiry, name servers)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: WHOIS data } }

  /domains/{id}/bandwidth:
    get:
      tags: [Domains]
      summary: Bandwidth usage for a domain (bytes + requests, daily series)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
        - { in: query, name: from, schema: { type: string, description: "start date YYYY-MM-DD (default 30 days ago)" } }
        - { in: query, name: to, schema: { type: string, description: "end date YYYY-MM-DD (default today)" } }
      responses: { "200": { description: Bandwidth series } }

  /me:
    get:
      tags: [Account]
      summary: The calling account — id, email, package, limits
      responses: { "200": { description: Account info } }

  /me/disk-usage:
    get:
      tags: [Account]
      summary: Disk usage breakdown — files, mail, databases vs quota
      responses: { "200": { description: Usage snapshot } }

  /me/activity:
    get:
      tags: [Account]
      summary: Your recent activity (audit events, newest first)
      responses: { "200": { description: Activity page } }

  # -------------------------------------------------------------- Cron ---

  /cron:
    get:
      tags: [Cron]
      summary: List your cron jobs
      responses: { "200": { description: Cron jobs } }
    post:
      tags: [Cron]
      summary: Create a cron job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, command, schedule]
              properties:
                name:     { type: string, description: "job label" }
                command:  { type: string, description: "shell command to run (as your user)" }
                schedule: { type: string, description: "cron schedule expression, e.g. '*/15 * * * *'" }
                enabled:  { type: boolean, default: true }
      responses: { "201": { description: Created } }

  /cron/{id}:
    get:
      tags: [Cron]
      summary: Get a cron job
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: OK } }
    patch:
      tags: [Cron]
      summary: Update a cron job (partial — absent fields are left untouched)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:     { type: string, description: "job label" }
                command:  { type: string, description: "shell command to run (as your user)" }
                schedule: { type: string, description: "cron schedule expression, e.g. '*/15 * * * *'" }
                enabled:  { type: boolean, description: "enable or disable the job" }
      responses: { "200": { description: Updated } }
    delete:
      tags: [Cron]
      summary: Delete a cron job
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "204": { description: Deleted } }

  /cron/{id}/run-now:
    post:
      tags: [Cron]
      summary: Run a cron job immediately (409 if the job is disabled)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: Run result } }

  /cron/{id}/log:
    get:
      tags: [Cron]
      summary: Read a cron job's recent log output
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: ulid } }
        - { in: query, name: lines, schema: { type: integer, minimum: 1, maximum: 500, description: "trailing lines to return (default 50)" } }
      responses: { "200": { description: Log lines } }

  # ---------------------------------------------------------- SSH keys ---

  /ssh-keys:
    get:
      tags: [SSH Keys]
      summary: List your SSH keys (name + fingerprint; never the key material)
      responses: { "200": { description: Keys } }
    post:
      tags: [SSH Keys]
      summary: Add an SSH public key for SFTP/SSH access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, public_key]
              properties:
                name:       { type: string, description: "key label, e.g. laptop" }
                public_key: { type: string, description: "OpenSSH public key line (ed25519 or RSA >= 2048 bits)" }
      responses: { "201": { description: Added } }

  /ssh-keys/{id}:
    delete:
      tags: [SSH Keys]
      summary: Remove an SSH key (revokes its access)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "204": { description: Removed } }

  # --------------------------------------------------------------- PHP ---

  /domains/{id}/php-settings:
    get:
      tags: [PHP]
      summary: Effective PHP settings for a domain (version, limits)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      responses: { "200": { description: Settings } }
    patch:
      tags: [PHP]
      summary: Update a domain's PHP settings (partial — absent fields are left untouched)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: ulid } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                php_version:             { type: string, description: "e.g. 8.3 — must be installed on the server (see list_php_versions); changes the pool shared by ALL your domains" }
                php_memory_limit:        { type: string, description: "digits + optional K/M/G suffix, e.g. 256M" }
                php_upload_max_filesize: { type: string, description: "digits + optional K/M/G suffix, e.g. 64M" }
                php_post_max_size:       { type: string, description: "digits + optional K/M/G suffix, e.g. 64M" }
                php_max_input_vars:      { type: integer, minimum: 1, maximum: 86400, description: "max request input variables" }
                php_max_execution_time:  { type: integer, minimum: 1, maximum: 86400, description: "script time limit, seconds" }
                php_max_input_time:      { type: integer, minimum: 1, maximum: 86400, description: "input parsing time limit, seconds" }
      responses: { "200": { description: Updated } }

  /php/versions:
    get:
      tags: [PHP]
      summary: PHP runtimes installed on the server
      responses: { "200": { description: Versions } }

  # ------------------------------------------------------------- Files ---

  /files:
    get:
      tags: [Files]
      summary: List a directory in your home (name, size, mtime per entry)
      parameters:
        - { in: query, name: path, required: true, schema: { type: string, description: "directory path inside your home, e.g. /public_html" } }
      responses: { "200": { description: Directory entries } }

  /files/preview:
    get:
      tags: [Files]
      summary: Read a file's contents (max 1 MiB; may expose secrets such as wp-config.php — handle with care)
      parameters:
        - { in: query, name: path, required: true, schema: { type: string, description: "file path inside your home" } }
      responses: { "200": { description: "File content (base64 when binary)" } }

  # ---------------------------------------------------------- Admin: Users ---

  /admin/users:
    get:
      tags: [Users]
      summary: List all panel users (admin)
      responses: { "200": { description: OK } }
    post:
      tags: [Users]
      summary: Create a tenant user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                is_admin: { type: boolean, default: false }
      responses: { "201": { description: Created } }

  # ----------------------------------------------- Admin: Server Settings ---

  /admin/settings:
    get:
      tags: [Server Settings]
      summary: Read server-wide settings (admin)
      responses: { "200": { description: ServerSettings JSON } }
    patch:
      tags: [Server Settings]
      summary: Update server-wide settings (admin)
      description: |
        Partial update — only fields present in the body are applied. Fields:
        hostname, public_ipv4, public_ipv6, ns1_*, ns2_*, admin_email,
        timezone, ssh_port, ssh_password_auth, default_dns_ttl, …
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname: { type: string }
                default_dns_ttl:
                  type: integer
                  minimum: 60
                  maximum: 86400
                  description: "Server-wide default TTL for new DNS records (seconds)."
      responses: { "200": { description: Updated } }

  # ------------------------------------------------------- Admin: Updates ---

  /admin/updates/run:
    post:
      tags: [Updates]
      summary: Trigger `jabali update` (admin)
      description: |
        Spawns a transient systemd unit that runs the update flow
        (download release tarball or build from source, run migrations,
        restart services). Returns immediately with a job handle.
      responses: { "202": { description: Job queued — stream logs via WebSocket } }

